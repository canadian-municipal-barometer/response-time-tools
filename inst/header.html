<script>
  (function () {
    console.log("Timing logger initialized");
    // ---- CONFIG ----
    const ED_FIELD = "timing";
    const INPUT_DEBOUNCE_MS = 500; // adjust: 300–800ms typical

    // ---- STATE INIT ----
    function getState() {
      let raw = Qualtrics.SurveyEngine.getJSEmbeddedData(ED_FIELD);

      if (!raw) return { pages: [] };

      try {
        return JSON.parse(raw);
      } catch (e) {
        return { pages: [] };
      }
    }

    function setState(state) {
      Qualtrics.SurveyEngine.setJSEmbeddedData(ED_FIELD, JSON.stringify(state));
    }

    function now() {
      return new Date().toISOString();
    }

    function getPageIndex(state) {
      return state.pages.length;
    }

    // ---- MAIN HOOK ----
    Qualtrics.SurveyEngine.addOnReady(function () {
      const state = getState();
      const pageIndex = getPageIndex(state);

      const page = {
        page_index: pageIndex,
        load_time: now(),
        events: [],
      };

      // Resolve the Qualtrics question id (e.g. "QID69", or a matrix statement
      // like "QID47-4") for an element. Radios/checkboxes carry it directly on
      // `name`; text/textarea inputs don't -- in the new survey-taking
      // experience they have no id or name at all, only an
      // `aria-labelledby="question-display-QIDn"` and a `question-QIDn` wrapper
      // -- so recover the QID from the element's own id/name, its
      // aria-labelledby, or the nearest ancestor whose id contains the QID.
      // Returning the id as `name` keeps every answer event in the shape the
      // downstream parser keys on.
      function resolveName(el) {
        if (el.name && /^QID\d/.test(el.name)) return el.name;

        const fromSelf = (el.id || el.name || "").match(/QID\d+(?:-\d+)?/);
        if (fromSelf) return fromSelf[0];

        const labelledby =
          (el.getAttribute && el.getAttribute("aria-labelledby")) || "";
        const fromAria = labelledby.match(/QID\d+(?:-\d+)?/);
        if (fromAria) return fromAria[0];

        const container = el.closest('[id*="QID"]');
        if (container) {
          const fromContainer = container.id.match(/QID\d+(?:-\d+)?/);
          if (fromContainer) return fromContainer[0];
        }

        return el.name || null;
      }

      // ---- EVENT LOGGER ----
      function logEvent(type, el) {
        const event = {
          type: type,
          time: now(),
        };

        if (el) {
          if (el.type) {
            event.input_type = el.type;
          }

          const name = resolveName(el);
          if (name) {
            event.name = name;
          }
        }

        page.events.push(event);
      }

      // ---- DEBOUNCE STATE (per element) ----
      const debounceMap = new WeakMap();

      function debounceInput(el) {
        if (!el) return;

        if (debounceMap.has(el)) {
          clearTimeout(debounceMap.get(el));
        }

        const timeoutId = setTimeout(function () {
          logEvent("input", el);
          debounceMap.delete(el);
        }, INPUT_DEBOUNCE_MS);

        debounceMap.set(el, timeoutId);
      }

      // Helpers

      function isTextLike(el) {
        if (!el || !el.tagName) return false;
        if (el.tagName === "TEXTAREA") return true;
        if (el.tagName === "INPUT") {
          return /^(text|email|number|search|tel|url|password)$/.test(el.type);
        }
        return false;
      }

      function isMeaningfulClick(el) {
        if (!el || !el.tagName) return false;
        // Only log clicks on things you actually "press": buttons and links.
        // Radio/checkbox selection is captured by `change`.
        if (el.tagName === "BUTTON" || el.tagName === "A") return true;
        if (el.tagName === "INPUT" && /^(button|submit)$/.test(el.type))
          return true;
        return false;
      }

      // ---- INTERACTION TRACKING ----

      // New-experience drop-downs are an ARIA combobox -- a
      // <div role="combobox" id="QIDn"> backed by a <ul role="listbox"> of
      // <li role="option"> items -- with no native <select>. Picking a value
      // fires no change/input event, only a click on the option <li>, so capture
      // that and log the answer in the same shape as other inputs (type
      // "change", input_type "select", name = QID). The option id is
      // "menu-item-QIDn-<choice>", so read the QID from the owning
      // "question-QIDn" wrapper to drop the choice suffix.
      function logDropdownSelect(optionEl) {
        const wrapper = optionEl.closest('[id^="question-QID"]');
        const src = (wrapper && wrapper.id) || optionEl.id || "";
        const match = src.match(/QID\d+/);
        if (!match) return;

        page.events.push({
          type: "change",
          time: now(),
          input_type: "select",
          name: match[0],
        });
      }

      document.addEventListener("click", function (e) {
        const option = e.target.closest && e.target.closest('[role="option"]');
        if (option) {
          logDropdownSelect(option);
          return;
        }

        if (isMeaningfulClick(e.target)) logEvent("click", e.target);
      });

      document.addEventListener("change", function (e) {
        // Canonical "user provided an answer" for radios, checkboxes, selects,
        // and (on blur) text fields.
        logEvent("change", e.target);
      });

      document.addEventListener("input", function (e) {
        // Only debounce real text entry. Radios/checkboxes also fire `input`
        // but `change` already covers them.
        if (isTextLike(e.target)) debounceInput(e.target);
      });

      // ---- FOCUS / VISIBILITY ----

      document.addEventListener("visibilitychange", function () {
        logEvent(document.hidden ? "hidden" : "visible");
      });

      window.addEventListener("blur", function () {
        logEvent("window_blur");
      });

      window.addEventListener("focus", function () {
        logEvent("window_focus");
      });

      // ---- PAGE SUBMIT ----
      Qualtrics.SurveyEngine.addOnPageSubmit(function () {
        page.submit_time = now();

        state.pages.push(page);

        setState(state);
      });
    });
  })();
</script>
